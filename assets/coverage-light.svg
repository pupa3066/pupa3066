<text x="250.0" y="212" font-size="12" text-anchor="middle" fill="#59636e">0.0</text>
<line x1="430.0" y1="78" x2="430.0" y2="194" stroke="#d1d9e0" stroke-width="1"/>
<text x="430.0" y="212" font-size="12" text-anchor="middle" fill="#59636e">0.2</text>
<line x1="610.0" y1="78" x2="610.0" y2="194" stroke="#d1d9e0" stroke-width="1"/>
<text x="610.0" y="212" font-size="12" text-anchor="middle" fill="#59636e">0.4</text>
<line x1="790.0" y1="78" x2="790.0" y2="194" stroke="#d1d9e0" stroke-width="1"/>
