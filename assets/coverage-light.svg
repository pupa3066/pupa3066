<text x="236" y="111" font-size="14" text-anchor="end" fill="#1f2328">all code indexed</text>
<rect x="250" y="92" width="236.7" height="28" rx="4" fill="#0969da"></rect>
<text x="496.7" y="111" font-size="14" font-weight="600" fill="#1f2328">0.263</text>
