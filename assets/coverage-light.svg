<svg xmlns="http://www.w3.org/2000/svg" width="880" height="242" viewBox="0 0 880 242" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="880" height="242" rx="8" fill="#ffffff"/>
