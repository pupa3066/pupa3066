<rect x="250" y="138" width="128.7" height="28" rx="4" fill="#bf8700"></rect>
<text x="388.7" y="157" font-size="14" font-weight="600" fill="#1f2328">0.143</text>
<text x="24" y="232" font-size="12" fill="#59636e">Exact McNemar p = 7e-6; holds after Holm correction over 27 primary tests.</text>
